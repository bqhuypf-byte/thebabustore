server {
    listen 80;
    server_name thebabustore.vn www.thebabustore.vn;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 40m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    # Livewire serves JavaScript through Laravel; bypass the static .js rule.
    location ^~ /livewire/ { try_files $uri /index.php?$query_string; }
    # Legacy developer/transaction import endpoints are not public services.
    location ~ ^/(optimize|transactions)(/|$) { return 404; }
    location ~ /\. { deny all; }
    location ~ ^/storage/.*\.(php|phtml|phar)$ { return 404; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
        fastcgi_read_timeout 90;
    }
    location ~* \.(css|js|woff2?|png|jpe?g|gif|webp|avif|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
    }
}

