# BABU pre-launch host: ACME is available before DNS cutover.
server {
    listen 80;
    server_name thebabustore.vn www.thebabustore.vn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        add_header Retry-After 300 always;
        return 503 "BABU Store is being prepared. Please return shortly.\n";
    }
}

