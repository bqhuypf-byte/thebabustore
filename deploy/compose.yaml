name: thebabustore
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: thebabustore-php:production
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:8082:80
    volumes:
      - ../:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks:
      private:
      edge:
        aliases: [babu-web]
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .database.env
    command: [--innodb-buffer-pool-size=256M, --max-connections=60]
    volumes:
      - babu-db:/var/lib/mysql
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -Nse "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    image: thebabustore-php:production
    restart: unless-stopped
    working_dir: /var/www/html
    user: www-data
    command: [php, artisan, queue:work, --sleep=3, --tries=3, --timeout=60, --max-time=3600]
    volumes:
      - ../:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    profiles: [workers]
volumes:
  babu-db:
networks:
  private:
  edge:
    external: true
    name: ruouvanxuan_default

