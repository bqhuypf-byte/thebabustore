server {
    listen 80;
    server_name thebabustore.vn www.thebabustore.vn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://thebabustore.vn$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name www.thebabustore.vn;
    ssl_certificate /etc/letsencrypt/live/thebabustore.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thebabustore.vn/privkey.pem;
    return 301 https://thebabustore.vn$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name thebabustore.vn;
    ssl_certificate /etc/letsencrypt/live/thebabustore.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thebabustore.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 40m;
    resolver 127.0.0.11 valid=30s;
    set $babu_upstream http://babu-web:80;
    location / {
        proxy_pass $babu_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
}

